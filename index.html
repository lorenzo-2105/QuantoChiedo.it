<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calcolatore Preventivi Freelance & Creator</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.5;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 600;
    }
    input, select, textarea {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: #0066cc;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #0052a3;
    }
    #result {
      margin-top: 20px;
      padding: 15px;
      background-color: #f4f4f9;
      border-radius: 4px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <h2>Calcolatore Preventivi Italia</h2>

  <form id="pricingForm">
    <div class="form-group">
      <label for="serviceType">Categoria Servizio</label>
      <input type="text" id="serviceType" name="serviceType" placeholder="Es. Video Reel Instagram, Sviluppo Web, etc." required>
    </div>

    <div class="form-group">
      <label for="description">Descrizione Dettagliata</label>
      <textarea id="description" name="description" rows="3" required></textarea>
    </div>

    <div class="form-group">
      <label for="level">Livello Esperienza</label>
      <select id="level" name="level">
        <option value="Junior">Junior (1-2 anni)</option>
        <option value="Mid-Level" selected>Mid-Level (3-5 anni)</option>
        <option value="Senior">Senior (5+ anni)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="followers">Follower (se applicabile)</label>
      <input type="text" id="followers" name="followers" placeholder="Es. 25k">
    </div>

    <div class="form-group">
      <label for="hours">Ore di Lavoro Stimate</label>
      <input type="number" id="hours" name="hours" value="10">
    </div>

    <div class="form-group">
      <label for="expensePayer">Gestione Spese Vive</label>
      <select id="expensePayer" name="expensePayer">
        <option value="client">A carico del cliente</option>
        <option value="freelancer">A carico mio (anticipate)</option>
      </select>
    </div>

    <button type="submit">Calcola Preventivo</button>
  </form>

  <div id="result" style="display:none;"></div>

  <script>
    document.getElementById('pricingForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const resultDiv = document.getElementById('result');
      resultDiv.style.display = 'block';
      resultDiv.textContent = 'Calcolo in corso...';

      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData.entries());

      try {
        const response = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const resData = await response.json();

        if (!response.ok) {
          resultDiv.textContent = 'Errore: ' + (resData.error || 'Errore durante la richiesta.');
          return;
        }

        resultDiv.textContent = JSON.stringify(resData, null, 2);

      } catch (err) {
        resultDiv.textContent = 'Errore di rete: ' + err.message;
      }
    });
  </script>

</body>
</html>
