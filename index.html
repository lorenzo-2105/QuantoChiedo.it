<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantoChiedo.it | Preventivo Reale e Controllato</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --fin-emerald: #10b981;
            --fin-emerald-hover: #059669;
            --bg-dark: #090d16;
            --card-glass: rgba(15, 23, 42, 0.75);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: radial-gradient(circle at 50% -20%, rgba(16, 185, 129, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 100% 100%, rgba(14, 116, 144, 0.2) 0%, var(--bg-dark) 60%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px 16px 60px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-container {
            max-width: 900px;
            width: 100%;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .logo {
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #34d399, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .hero-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .hero-title {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
            color: #ffffff;
        }

        .hero-subtitle {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 24px;
            font-weight: 500;
        }

        .counter-box {
            margin-bottom: 25px;
        }

        .counter-label {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .counter-number {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--fin-emerald);
            letter-spacing: -0.02em;
        }

        .search-area-wrapper {
            position: relative;
            max-width: 650px;
            margin: 0 auto 20px auto;
        }

        .search-card {
            background: var(--card-glass);
            backdrop-filter: blur(12px);
            padding: 8px 8px 8px 20px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .search-card select {
            border: none;
            background: transparent;
            font-size: 0.95rem;
            color: var(--text-main);
            outline: none;
            width: 100%;
            padding: 8px;
            cursor: pointer;
        }

        .search-card select option {
            background: #0f172a;
            color: white;
        }

        .btn-search-main {
            background: var(--fin-emerald);
            color: #060812;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .btn-search-main:hover {
            background: var(--fin-emerald-hover);
        }

        .config-panel {
            background: var(--card-glass);
            border: 1px solid var(--border-glass);
            padding: 24px;
            border-radius: 20px;
            margin-top: 10px;
            text-align: left;
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        .config-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 768px) {
            .config-grid { grid-template-columns: 1fr; }
            .hero-title { font-size: 2rem; }
        }

        .field-group {
            margin-top: 14px;
        }

        .field-group label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 700;
            display: block;
            margin-bottom: 6px;
            letter-spacing: 0.05em;
        }

        .field-group input, .field-group select, .field-group textarea {
            width: 100%;
            background: rgba(9, 13, 22, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 11px 14px;
            border-radius: 10px;
            color: white;
            font-size: 0.9rem;
            outline: none;
        }

        .field-group textarea {
            resize: vertical;
            min-height: 80px;
            line-height: 1.5;
        }

        .dynamic-fields-wrapper {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 16px;
            border-radius: 12px;
            margin-top: 14px;
        }

        .results-wrapper {
            display: none;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 20px;
            padding: 30px;
            margin-top: 30px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            text-align: left;
        }

        .single-proposal-card {
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid var(--fin-emerald);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        @media (max-width: 768px) {
            .single-proposal-card { flex-direction: column; align-items: flex-start; gap: 16px; }
        }

        .proposal-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .proposal-main-price {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--fin-emerald);
        }

        .proposal-net-price {
            font-size: 0.9rem;
            color: #34d399;
            font-weight: 600;
        }

        .creator-rationale-box, .email-short-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 14px;
            padding: 20px;
            margin-top: 24px;
        }

        .rationale-title {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--fin-emerald);
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .rationale-content {
            font-size: 0.88rem;
            color: #e2e8f0;
            line-height: 1.6;
        }

        .rationale-content ul {
            margin-left: 18px;
            margin-top: 6px;
            color: var(--text-muted);
        }

        .email-preview-text {
            white-space: pre-line;
            font-size: 0.85rem;
            background: rgba(0,0,0,0.5);
            padding: 14px;
            border-radius: 8px;
            color: #e2e8f0;
            margin-top: 8px;
            line-height: 1.6;
        }

        .btn-copy {
            background: rgba(255,255,255,0.08);
            color: white;
            border: 1px solid var(--border-glass);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="main-container">
    <header class="navbar">
        <div class="logo">QuantoChiedo</div>
    </header>

    <section class="hero-section">
        <h1 class="hero-title">Preventivo Reale e Controllato</h1>
        <p class="hero-subtitle">Gestione precisa dei pacchetti e dei deliverable multipli.</p>

        <div class="counter-box">
            <div class="counter-label">Preventivi elaborati</div>
            <div class="counter-number" id="dynamicCounter">10.480</div>
        </div>

        <div class="search-area-wrapper">
            <div class="search-card">
                <select id="serviceType">
                    <option value="socialmanager" selected>📱 Social Media Manager / Content Creator</option>
                    <option value="videomaker">🎥 Videomaker / Produzione Video</option>
                    <option value="freelance">💼 Sviluppatore Web / Fullstack</option>
                    <option value="designer">🎨 Grafico / Brand Designer</option>
                </select>
                <button class="btn-search-main" onclick="calculatePricing()">Calcola Preventivo</button>
            </div>
        </div>

        <div class="config-panel">
            <div class="config-grid">
                <div class="field-group">
                    <label>MODALITÀ DI CALCOLO</label>
                    <select id="calcMode" onchange="toggleModeFields()">
                        <option value="package" selected>🌟 Pacchetto Creator (Reel + Storie + Altro)</option>
                        <option value="hourly">⏱️ Tariffa a Tempo (Ore o Giornate)</option>
                    </select>
                </div>
                <div class="field-group">
                    <label>TIPOLOGIA COMMITTENTE</label>
                    <select id="clientType">
                        <option value="pmi" selected>Privato / PMI</option>
                        <option value="startup">Startup / Brand Emergente</option>
                        <option value="enterprise">Corporate / Azienda Strutturata</option>
                    </select>
                </div>
            </div>

            <!-- PACCHETTO CREATOR AGGIORNATO CON "ALTRO CONTENUTO" -->
            <div class="dynamic-fields-wrapper" id="packageFields">
                <div class="config-grid" style="margin-top:0;">
                    <div class="field-group" style="margin-top:0;">
                        <label>FASCIA FOLLOWER</label>
                        <select id="followerTier">
                            <option value="10k">10.000 - 30.000 follower</option>
                            <option value="60k" selected>50.000 - 80.000 follower (Mid-level)</option>
                            <option value="100k">100.000+ follower (Top)</option>
                        </select>
                    </div>
                    <div class="field-group" style="margin-top:0;">
                        <label>NUMERO DI REEL</label>
                        <input type="number" id="numReels" value="0" min="0">
                    </div>
                </div>
                <div class="config-grid">
                    <div class="field-group" style="margin-top:0;">
                        <label>NUMERO DI STORIE IG</label>
                        <input type="number" id="numStories" value="0" min="0">
                    </div>
                    <div class="field-group" style="margin-top:0;">
                        <label>ALTRI CONTENUTI (Post Carosello / Foto)</label>
                        <input type="number" id="numOther" value="0" min="0">
                    </div>
                </div>
                <div class="field-group">
                    <label>UTILIZZO DIRITTI ADV / DARK POST?</label>
                    <select id="advRights">
                        <option value="no" selected>No (Solo organico)</option>
                        <option value="yes">Sì (Diritti ADV attivi +25%)</option>
                    </select>
                </div>
            </div>

            <!-- MODALITÀ ORARIA -->
            <div class="dynamic-fields-wrapper" id="hourlyFields" style="display: none;">
                <div class="config-grid" style="margin-top:0;">
                    <div class="field-group" style="margin-top:0;">
                        <label>QUANTITÀ E TEMPO</label>
                        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 8px;">
                            <input type="number" id="workQuantity" value="0" min="0">
                            <select id="timeUnit">
                                <option value="ore" selected>Ore</option>
                                <option value="giorni">Giorni</option>
                            </select>
                        </div>
                    </div>
                    <div class="field-group" style="margin-top:0;">
                        <label>COSTI VIVI / SOFTWARE (€)</label>
                        <input type="number" id="softwareCosts" value="0" min="0">
                    </div>
                </div>
            </div>

            <div class="config-grid">
                <div class="field-group">
                    <label>DESCRIZIONE DEL PROGETTO</label>
                    <textarea id="description" placeholder="Dettagli del brief..."></textarea>
                </div>
                <div class="field-group">
                    <label>SENIORITÀ</label>
                    <select id="level" style="margin-top: 6px;">
                        <option value="Junior">Junior</option>
                        <option value="Mid" selected>Mid-Level</option>
                        <option value="Senior">Senior</option>
                    </select>
                </div>
            </div>
        </div>
    </section>

    <div class="results-wrapper" id="resultsBlock">
        <h2 style="font-size: 1.1rem; font-weight: 800; margin-bottom: 20px; color: var(--fin-emerald);">🎯 Proposta Economica</h2>
        
        <div class="single-proposal-card">
            <div>
                <div class="proposal-title" id="proposalTypeName">Preventivo Ufficiale</div>
                <div class="proposal-main-price" id="finalGrossPrice">€0</div>
                <div class="proposal-net-price" id="finalNetPrice">Stima netto in tasca: €0</div>
            </div>
        </div>

        <div class="creator-rationale-box">
            <div class="rationale-title">🔍 Dettaglio Calcolo</div>
            <div class="rationale-content" id="rationaleText"></div>
        </div>

        <div class="email-short-box">
            <label style="font-size: 0.75rem; font-weight: 700; color: var(--fin-emerald);">✉️ EMAIL PRONTA</label>
            <div class="email-preview-text" id="emailBody"></div>
            <button class="btn-copy" onclick="copyText('emailBody')">Copia Testo</button>
        </div>
    </div>
</div>

<script>
    window.onload = function() {
        document.getElementById('numReels').value = 0;
        document.getElementById('numStories').value = 0;
        document.getElementById('numOther').value = 0;
        document.getElementById('workQuantity').value = 0;
        document.getElementById('softwareCosts').value = 0;
        document.getElementById('description').value = "";
    };

    function toggleModeFields() {
        const mode = document.getElementById('calcMode').value;
        if (mode === 'package') {
            document.getElementById('packageFields').style.display = 'block';
            document.getElementById('hourlyFields').style.display = 'none';
        } else {
            document.getElementById('packageFields').style.display = 'none';
            document.getElementById('hourlyFields').style.display = 'block';
        }
    }

    function calculatePricing() {
        const mode = document.getElementById('calcMode').value;
        const clientType = document.getElementById('clientType').value;
        const level = document.getElementById('level').value;
        const descriptionRaw = document.getElementById('description').value.trim();

        let clientMultiplier = clientType === 'startup' ? 1.1 : (clientType === 'enterprise' ? 1.25 : 1.0);
        let levelMultiplier = level === 'Junior' ? 0.85 : (level === 'Senior' ? 1.2 : 1.0);

        let finalGross = 0;
        let rationaleDetails = "";

        if (mode === 'package') {
            const followerTier = document.getElementById('followerTier').value;
            const numReels = parseFloat(document.getElementById('numReels').value) || 0;
            const numStories = parseFloat(document.getElementById('numStories').value) || 0;
            const numOther = parseFloat(document.getElementById('numOther').value) || 0;
            const advRights = document.getElementById('advRights').value;

            let reelUnitValue = 240;
            let storyUnitValue = 35;
            let otherUnitValue = 100;
            let followerLabel = "50k - 80k follower (Mid-level)";

            if (followerTier === '10k') {
                reelUnitValue = 100; storyUnitValue = 15; otherUnitValue = 50;
                followerLabel = "10k - 30k follower";
            } else if (followerTier === '100k') {
                reelUnitValue = 400; storyUnitValue = 60; otherUnitValue = 180;
                followerLabel = "100k+ follower";
            }

            let dynamicReelsTotal = numReels * reelUnitValue;
            let dynamicStoriesTotal = numStories * storyUnitValue;
            let dynamicOtherTotal = numOther * otherUnitValue;
            let rawContentSum = dynamicReelsTotal + dynamicStoriesTotal + dynamicOtherTotal;

            let advMultiplier = advRights === 'yes' ? 1.25 : 1.0;
            let calculatedSubtotal = rawContentSum * levelMultiplier * clientMultiplier * advMultiplier;
            finalGross = Math.round(calculatedSubtotal);

            rationaleDetails = `
                <li><strong>Modalità:</strong> Pacchetto Creator / Influencer</li>
                <li><strong>Fascia Audience:</strong> ${followerLabel}</li>
                <li><strong>Deliverable:</strong> ${numReels} Reel (€${dynamicReelsTotal}), ${numStories} Storie (€${dynamicStoriesTotal}), ${numOther} Altri contenuti (€${dynamicOtherTotal})</li>
                <li><strong>Diritti ADV:</strong> ${advRights === 'yes' ? 'Inclusi (+25%)' : 'Esclusi'}</li>
            `;
        } else {
            const workQuantity = parseFloat(document.getElementById('workQuantity').value) || 0;
            const timeUnit = document.getElementById('timeUnit').value;
            const softwareCosts = parseFloat(document.getElementById('softwareCosts').value) || 0;

            let baseHourlyRate = 25;
            let timeMultiplier = timeUnit === 'giorni' ? 7 : 1;
            let totalHours = workQuantity * timeMultiplier;

            let calculatedSubtotal = (baseHourlyRate * totalHours * levelMultiplier * clientMultiplier) + softwareCosts;
            finalGross = Math.round(calculatedSubtotal);

            rationaleDetails = `
                <li><strong>Modalità:</strong> Tariffa a Tempo (${workQuantity} ${timeUnit})</li>
                <li><strong>Costi Software:</strong> €${softwareCosts}</li>
            `;
        }

        let estimatedNet = Math.round(finalGross * 0.78);

        document.getElementById('finalGrossPrice').innerText = "€" + finalGross;
        document.getElementById('finalNetPrice').innerText = "Stima netto in tasca (circa): €" + estimatedNet;
        document.getElementById('rationaleText').innerHTML = `<ul>${rationaleDetails}</ul>`;
        document.getElementById('emailBody').innerText = `Salve,\n\nEcco il preventivo ufficiale:\n• Totale: €${finalGross}\n\nUn saluto,\n[Tuo Nome]`;

        document.getElementById('resultsBlock').style.display = 'block';
        document.getElementById('resultsBlock').scrollIntoView({ behavior: 'smooth' });
    }

    function copyText(elementId) {
        const text = document.getElementById(elementId).innerText;
        navigator.clipboard.writeText(text);
        alert("Testo copiato negli appunti!");
    }
</script>

</body>
</html>
