<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantoChiedo.it | AI Pricing & Preventivi Freelance</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 750px;
            width: 100%;
            margin-top: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            color: var(--accent-color);
            font-size: 2.2rem;
            margin-bottom: 6px;
        }

        .badge {
            background-color: #0284c7;
            color: white;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 12px;
            vertical-align: middle;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-color);
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 550px) {
            .form-grid { grid-template-columns: 1fr; }
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
            color: white;
        }

        .results {
            display: none;
            margin-top: 20px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .ai-box {
            background-color: #0f172a;
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .ai-title {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 8px;
        }

        .email-box {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 6px;
            font-size: 0.9rem;
            color: var(--text-color);
            white-space: pre-line;
            margin-top: 8px;
            line-height: 1.5;
        }

        #loading {
            display: none;
            text-align: center;
            color: var(--accent-color);
            font-weight: bold;
            margin: 15px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>QuantoChiedo.it <span class="badge">IA Inside</span></h1>
        <p class="subtitle">Calcola la tariffa ideale di mercato e genera proposte commerciali ad alto tasso di conversione</p>
    </header>

    <div class="card">
        <div class="form-group">
            <label for="description">Descrivi il Lavoro Richiesto dal Cliente</label>
            <textarea id="description" placeholder="Es. Montaggio di 3 video Reel per Instagram con grafiche animate e sound design inclusi."></textarea>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label for="level">Il Tuo Livello di Esperienza</label>
                <select id="level">
                    <option value="Junior">Junior (1-2 anni / Primi clienti)</option>
                    <option value="Mid-Level" selected>Intermedio (2-5 anni di esperienza)</option>
                    <option value="Senior">Senior / Specialist (5+ anni o nicchia alta)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="hours">Ore Stimate per Completarlo</label>
                <input type="number" id="hours" value="10" placeholder="Es. 10">
            </div>

            <div class="form-group">
                <label for="expenses">Spese Materiali / Acquisti Extra (€)</label>
                <input type="number" id="expenses" value="0" placeholder="Es. 30">
            </div>

            <div class="form-group">
                <label for="regime">Regime Fiscale</label>
                <select id="regime">
                    <option value="prestazione">Prestazione Occasionale (Ritenuta 20%)</option>
                    <option value="forfettario">Partita IVA Forfettaria</option>
                </select>
            </div>
        </div>

        <button onclick="calculateWithAI()">Analizza e Genera Preventivo IA</button>

        <div id="loading">✨ L'IA sta analizzando i prezzi di mercato e scrivendo l'e-mail...</div>

        <div class="results" id="resultsBlock">
            <div class="ai-box">
                <div class="ai-title">💡 Analisi di Mercato dell'IA</div>
                <p style="font-size: 0.9rem; margin: 4px 0;"><strong>Forchetta Media di Mercato:</strong> <span id="resRange">-</span></p>
                <p style="font-size: 0.9rem; margin: 4px 0;"><strong>Tariffa Oraria Consigliata:</strong> <span id="resRate">-</span></p>
                <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 8px;" id="resJustification"></p>
            </div>

            <label style="font-weight: bold; display: block; margin-top: 15px;">Oggetto Email Consigliato:</label>
            <input type="text" id="emailSubject" readonly style="margin-top: 5px; font-weight: bold; color: var(--accent-color);">

            <label style="font-weight: bold; display: block; margin-top: 15px;">Proposta Commerciale Professionale (Pronta da inviare):</label>
            <div class="email-box" id="emailBody"></div>
        </div>
    </div>
</div>

<script>
    async function calculateWithAI() {
        const description = document.getElementById('description').value;
        const level = document.getElementById('level').value;
        const hours = document.getElementById('hours').value;
        const expenses = document.getElementById('expenses').value;

        if (!description.trim()) {
            alert('Inserisci una breve descrizione del lavoro.');
            return;
        }

        document.getElementById('loading').style.display = 'block';
        document.getElementById('resultsBlock').style.display = 'none';

        try {
            const response = await fetch('/api/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ description, level, hours, expenses })
            });

            const data = await response.json();

            if (data.error) {
                alert('Errore: ' + data.error);
            } else {
                document.getElementById('resRange').innerText = data.marketRange;
                document.getElementById('resRate').innerText = '€' + data.recommendedRate + '/ora';
                document.getElementById('resJustification').innerText = data.justification;
                document.getElementById('emailSubject').value = data.emailSubject;
                document.getElementById('emailBody').innerText = data.emailBody;
                document.getElementById('resultsBlock').style.display = 'block';
            }
        } catch (err) {
            alert('Si è verificato un errore di connessione.');
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }
</script>

</body>
</html>
