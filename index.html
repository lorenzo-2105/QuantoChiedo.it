<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantoChiedo.it | Preventivo Dinamico per Professione</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --fin-emerald: #10b981;
            --fin-emerald-hover: #059669;
            --bg-dark: #090d16;
            --card-glass: rgba(15, 23, 42, 0.75);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: radial-gradient(circle at 50% -20%, rgba(16, 185, 129, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 100% 100%, rgba(14, 116, 144, 0.2) 0%, var(--bg-dark) 60%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px 16px 60px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-container {
            max-width: 900px;
            width: 100%;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .logo {
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #34d399, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .hero-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .hero-title {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
            color: #ffffff;
        }

        .hero-subtitle {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 24px;
            font-weight: 500;
        }

        .counter-box {
            margin-bottom: 25px;
        }

        .counter-label {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .counter-number {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--fin-emerald);
            letter-spacing: -0.02em;
        }

        .search-area-wrapper {
            position: relative;
            max-width: 650px;
            margin: 0 auto 20px auto;
        }

        .search-card {
            background: var(--card-glass);
            backdrop-filter: blur(12px);
            padding: 8px 8px 8px 20px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .search-card select {
            border: none;
            background: transparent;
            font-size: 0.95rem;
            color: var(--text-main);
            outline: none;
            width: 100%;
            padding: 8px;
            cursor: pointer;
        }

        .search-card select option {
            background: #0f172a;
            color: white;
        }

        .btn-search-main {
            background: var(--fin-emerald);
            color: #060812;
            border: none;
            padding: 14px 28px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
        }

        .btn-search-main:hover {
            background: var(--fin-emerald-hover);
        }

        .config-panel {
            background: var(--card-glass);
            border: 1px solid var(--border-glass);
            padding: 24px;
            border-radius: 20px;
            margin-top: 10px;
            text-align: left;
            backdrop-filter: blur(12px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }

        .config-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 768px) {
            .config-grid { grid-template-columns: 1fr; }
            .hero-title { font-size: 2rem; }
        }

        .field-group {
            margin-top: 14px;
        }

        .field-group label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 700;
            display: block;
            margin-bottom: 6px;
            letter-spacing: 0.05em;
        }

        .field-group input, .field-group select, .field-group textarea {
            width: 100%;
            background: rgba(9, 13, 22, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 11px 14px;
            border-radius: 10px;
            color: white;
            font-size: 0.9rem;
            outline: none;
        }

        .field-group textarea {
            resize: vertical;
            min-height: 80px;
            line-height: 1.5;
        }

        .dynamic-fields-wrapper {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 16px;
            border-radius: 12px;
            margin-top: 14px;
        }

        .results-wrapper {
            display: none;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 20px;
            padding: 30px;
            margin-top: 30px;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            text-align: left;
        }

        .single-proposal-card {
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid var(--fin-emerald);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        @media (max-width: 768px) {
            .single-proposal-card { flex-direction: column; align-items: flex-start; gap: 16px; }
        }

        .proposal-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .proposal-main-price {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--fin-emerald);
        }

        .proposal-net-price {
            font-size: 0.9rem;
            color: #34d399;
            font-weight: 600;
        }

        .creator-rationale-box, .email-short-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 14px;
            padding: 20px;
            margin-top: 24px;
        }

        .rationale-title {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--fin-emerald);
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .rationale-content {
            font-size: 0.88rem;
            color: #e2e8f0;
            line-height: 1.6;
        }

        .rationale-content ul {
            margin-left: 18px;
            margin-top: 6px;
            color: var(--text-muted);
        }

        .email-preview-text {
            white-space: pre-line;
            font-size: 0.85rem;
            background: rgba(0,0,0,0.5);
            padding: 14px;
            border-radius: 8px;
            color: #e2e8f0;
            margin-top: 8px;
            line-height: 1.6;
        }

        .btn-copy {
            background: rgba(255,255,255,0.08);
            color: white;
            border: 1px solid var(--border-glass);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="main-container">
    <header class="navbar">
        <div class="logo">QuantoChiedo</div>
    </header>

    <section class="hero-section">
        <h1 class="hero-title">Preventivo Dinamico per Professione</h1>
        <p class="hero-subtitle">Ogni mansione ha i suoi parametri specifici di tempo, mesi e deliverable.</p>

        <div class="counter-box">
            <div class="counter-label">Preventivi elaborati</div>
            <div class="counter-number" id="dynamicCounter">10.542</div>
        </div>

        <div class="search-area-wrapper">
            <div class="search-card">
                <select id="serviceType" onchange="updateProfessionFields()">
                    <option value="socialmanager" selected>📱 Social Media Manager / Content Creator</option>
                    <option value="videomaker">🎥 Videomaker / Produzione Video</option>
                    <option value="freelance">💼 Sviluppatore Web / Fullstack</option>
                    <option value="designer">🎨 Grafico / Brand Designer</option>
                    <option value="photographer">📸 Fotografo / Eventi & Commerciale</option>
                    <option value="consultant">📊 Consulente Strategico / Business</option>
                </select>
                <button class="btn-search-main" onclick="calculatePricing()">Calcola Preventivo</button>
            </div>
        </div>

        <div class="config-panel">
            <div class="config-grid">
                <div class="field-group">
                    <label>MODALITÀ DI CALCOLO</label>
                    <select id="calcMode" onchange="toggleModeFields()">
                        <option value="package" selected>🌟 Pacchetto / Deliverable Specifici</option>
                        <option value="hourly">⏱️ Tariffa a Tempo (Ore / Giorni / Mesi)</option>
                    </select>
                </div>
                <div class="field-group">
                    <label>TIPOLOGIA COMMITTENTE</label>
                    <select id="clientType">
                        <option value="pmi" selected>Privato / PMI / Locale</option>
                        <option value="startup">Startup / Brand Emergente</option>
                        <option value="enterprise">Corporate / Azienda Strutturata</option>
                    </select>
                </div>
            </div>

            <!-- SEZIONE SPECIFICA PER PACCHETTI / DELIVERABLE DINAMICI -->
            <div class="dynamic-fields-wrapper" id="packageFields">
                <div class="config-grid" style="margin-top:0;">
                    <div class="field-group" style="margin-top:0;">
                        <label id="labelTier">FASCIA AUDIENCE / SCALA PROGETTO</label>
                        <select id="projectTier">
                            <option value="base">Base / Standard</option>
                            <option value="mid" selected>Intermedio / Mid-level</option>
                            <option value="top">Avanzato / Enterprise</option>
                        </select>
                    </div>
                    <div class="field-group" style="margin-top:0;">
                        <label id="labelField1">NUMERO DI REEL / VIDEO</label>
                        <input type="number" id="valField1" value="0" min="0">
                    </div>
                </div>
                <div class="config-grid">
                    <div class="field-group" style="margin-top:0;">
                        <label id="labelField2">NUMERO DI STORIE / SEZIONI</label>
                        <input type="number" id="valField2" value="0" min="0">
                    </div>
                    <div class="field-group" style="margin-top:0;">
                        <label id="labelField3">ALTRI ELEMENTI (Caroselli / Extra)</label>
                        <input type="number" id="valField3" value="0" min="0">
                    </div>
                </div>
                <div class="field-group">
                    <label>DURATA DELLA COLLABORAZIONE (IN MESI)</label>
                    <input type="number" id="contractMonths" value="1" min="1">
                </div>
            </div>

            <!-- SEZIONE SPECIFICA PER TARIFFA A TEMPO / ORE / MESI -->
            <div class="dynamic-fields-wrapper" id="hourlyFields" style="display: none;">
                <div class="config-grid" style="margin-top:0;">
                    <div class="field-group" style="margin-top:0;">
                        <label>UNITÀ DI TEMPO E QUANTITÀ</label>
                        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 8px;">
                            <input type="number" id="timeQuantity" value="0" min="0">
                            <select id="timeUnit">
                                <option value="ore" selected>Ore</option>
                                <option value="giorni">Giorni</option>
                                <option value="mesi">Mesi (Full-time)</option>
                            </select>
                        </div>
                    </div>
                    <div class="field-group" style="margin-top:0;">
                        <label>COSTI VIVI / SOFTWARE / TRASFERTE (€)</label>
                        <input type="number" id="extraCosts" value="0" min="0">
                    </div>
                </div>
            </div>

            <div class="config-grid">
                <div class="field-group">
                    <label>DESCRIZIONE DEL PROGETTO / NOTE</label>
                    <textarea id="description" placeholder="Aggiungi dettagli sul brief del cliente..."></textarea>
                </div>
                <div class="field-group">
                    <label>SENIORITÀ / ESPERIENZA</label>
                    <select id="level" style="margin-top: 6px;">
                        <option value="Junior">Junior / Emergente</option>
                        <option value="Mid" selected>Mid-Level / Professionista</option>
                        <option value="Senior">Senior / Top Expert</option>
                    </select>
                </div>
            </div>
        </div>
    </section>

    <div class="results-wrapper" id="resultsBlock">
        <h2 style="font-size: 1.1rem; font-weight: 800; margin-bottom: 20px; color: var(--fin-emerald);">🎯 Proposta Economica</h2>
        
        <div class="single-proposal-card">
            <div>
                <div class="proposal-title" id="proposalTypeName">Preventivo Ufficiale</div>
                <div class="proposal-main-price" id="finalGrossPrice">€0</div>
                <div class="proposal-net-price" id="finalNetPrice">Stima netto in tasca: €0</div>
            </div>
        </div>

        <div class="creator-rationale-box">
            <div class="rationale-title">🔍 Dettaglio Calcolo e Parametri</div>
            <div class="rationale-content" id="rationaleText"></div>
        </div>

        <div class="email-short-box">
            <label style="font-size: 0.75rem; font-weight: 700; color: var(--fin-emerald);">✉️ EMAIL PRONTA PER IL CLIENTE</label>
            <div class="email-preview-text" id="emailBody"></div>
            <button class="btn-copy" onclick="copyText('emailBody')">Copia Testo</button>
        </div>
    </div>
</div>

<script>
    window.onload = function() {
        resetFields();
        updateProfessionFields();
    };

    function resetFields() {
        document.getElementById('valField1').value = 0;
        document.getElementById('valField2').value = 0;
        document.getElementById('valField3').value = 0;
        document.getElementById('contractMonths').value = 1;
        document.getElementById('timeQuantity').value = 0;
        document.getElementById('extraCosts').value = 0;
        document.getElementById('description').value = "";
    }

    function toggleModeFields() {
        const mode = document.getElementById('calcMode').value;
        if (mode === 'package') {
            document.getElementById('packageFields').style.display = 'block';
            document.getElementById('hourlyFields').style.display = 'none';
        } else {
            document.getElementById('packageFields').style.display = 'none';
            document.getElementById('hourlyFields').style.display = 'block';
        }
    }

    // Aggiorna le etichette dei campi in base alla mansione scelta
    function updateProfessionFields() {
        const profession = document.getElementById('serviceType').value;
        
        let label1 = "NUMERO DI REEL / VIDEO";
        let label2 = "NUMERO DI STORIE IG";
        let label3 = "ALTRI ELEMENTI (Caroselli)";
        let labelTierText = "FASCIA FOLLOWER / AUDIENCE";

        if (profession === 'videomaker') {
            labelTierText = "TIPO PRODUZIONE / ATTREZZATURA";
            label1 = "NUMERO DI VIDEO FINALI";
            label2 = "GIORNATE DI RIPRESA (SET)";
            label3 = "VERSIONI / FORMATI EXTRA (Shorts/Reel)";
        } else if (profession === 'freelance') {
            labelTierText = "COMPLESSITÀ PIATTAFORMA";
            label1 = "NUMERO DI PAGINE WEB";
            label2 = "SEZIONI / FEATURE ADVANCED";
            label3 = "INTEGRAZIONI API / E-COMMERCE";
        } else if (profession === 'designer') {
            labelTierText = "SCALA DEL PROGETTO BRAND";
            label1 = "NUMERO DI BOZZE / CONCEPT LOGO";
            label2 = "APPLICAZIONI BRAND GUIDELINE";
            label3 = "ESECUTIVI GRAFICI / SOCIAL POST";
        } else if (profession === 'photographer') {
            labelTierText = "TIPO DI SERVIZIO FOTOGRAFICO";
            label1 = "NUMERO DI ORE DI SCATTO";
            label2 = "FOTO POST-PRODOTTE CONSEGNATE";
            label3 = "SET / SCENOGRAFIE EXTRA";
        } else if (profession === 'consultant') {
            labelTierText = "LIVELLO STRATEGICO";
            label1 = "NUMERO DI CALL / MEETING DI 1H";
            label2 = "AUDIT / REPORT APPROONDITI";
            label3 = "TAVOLI DI LAVORO EXTRA";
        }

        document.getElementById('labelTier').innerText = labelTierText;
        document.getElementById('labelField1').innerText = label1;
        document.getElementById('labelField2').innerText = label2;
        document.getElementById('labelField3').innerText = label3;
    }

    function calculatePricing() {
        const mode = document.getElementById('calcMode').value;
        const profession = document.getElementById('serviceType').value;
        const clientType = document.getElementById('clientType').value;
        const level = document.getElementById('level').value;

        let clientMultiplier = clientType === 'startup' ? 1.1 : (clientType === 'enterprise' ? 1.25 : 1.0);
        let levelMultiplier = level === 'Junior' ? 0.85 : (level === 'Senior' ? 1.25 : 1.0);

        let finalGross = 0;
        let rationaleDetails = "";
        let professionName = document.getElementById('serviceType').options[document.getElementById('serviceType').selectedIndex].text;

        if (mode === 'package') {
            const tier = document.getElementById('projectTier').value;
            const val1 = parseFloat(document.getElementById('valField1').value) || 0;
            const val2 = parseFloat(document.getElementById('valField2').value) || 0;
            const val3 = parseFloat(document.getElementById('valField3').value) || 0;
            const months = parseFloat(document.getElementById('contractMonths').value) || 1;

            // Tariffe base unitarie per singola mansione
            let baseU1 = 200, baseU2 = 35, baseU3 = 80;

            if (profession === 'videomaker') { baseU1 = 300; baseU2 = 400; baseU3 = 100; }
            else if (profession === 'freelance') { baseU1 = 150; baseU2 = 200; baseU3 = 300; }
            else if (profession === 'designer') { baseU1 = 250; baseU2 = 120; baseU3 = 60; }
            else if (profession === 'photographer') { baseU1 = 70; baseU2 = 25; baseU3 = 150; }
            else if (profession === 'consultant') { baseU1 = 120; baseU2 = 350; baseU3 = 200; }

            // Moltiplicatore di fascia/tier
            let tierMultiplier = tier === 'base' ? 0.7 : (tier === 'top' ? 1.6 : 1.0);

            let subtotalMonthly = (val1 * baseU1 + val2 * baseU2 + val3 * baseU3) * tierMultiplier;
            let totalBeforeModifiers = subtotalMonthly * months;

            finalGross = Math.round(totalBeforeModifiers * levelMultiplier * clientMultiplier);

            rationaleDetails = `
                <li><strong>Mansione:</strong> ${professionName} (Pacchetto / Deliverable)</li>
                <li><strong>Durata Contratto:</strong> ${months} mese/i</li>
                <li><strong>Elemento 1 (${val1} unità):</strong> €${Math.round(val1 * baseU1 * tierMultiplier)} al mese</li>
                <li><strong>Elemento 2 (${val2} unità):</strong> €${Math.round(val2 * baseU2 * tierMultiplier)} al mese</li>
                <li><strong>Elemento 3 (${val3} unità):</strong> €${Math.round(val3 * baseU3 * tierMultiplier)} al mese</li>
                <li><strong>Moltiplicatori Applicati:</strong> Seniorità (${level}), Cliente (${clientType})</li>
            `;
        } else {
            const timeQty = parseFloat(document.getElementById('timeQuantity').value) || 0;
            const timeUnit = document.getElementById('timeUnit').value;
            const extraCosts = parseFloat(document.getElementById('extraCosts').value) || 0;

            let hourlyRate = 30;
            if (profession === 'videomaker') hourlyRate = 45;
            else if (profession === 'freelance') hourlyRate = 50;
            else if (profession === 'designer') hourlyRate = 35;
            else if (profession === 'photographer') hourlyRate = 40;
            else if (profession === 'consultant') hourlyRate = 75;

            let totalHours = timeQty;
            if (timeUnit === 'giorni') totalHours = timeQty * 8;
            if (timeUnit === 'mesi') totalHours = timeQty * 160; // stima ore mensili standard

            let calculatedSubtotal = (hourlyRate * totalHours * levelMultiplier * clientMultiplier) + extraCosts;
            finalGross = Math.round(calculatedSubtotal);

            rationaleDetails = `
                <li><strong>Mansione:</strong> ${professionName} (Tariffa a Tempo)</li>
                <li><strong>Quantità Lavoro:</strong> ${timeQty} ${timeUnit} (circa ${totalHours} ore totali)</li>
                <li><strong>Tariffa Oraria Base:</strong> €${hourlyRate}/h</li>
                <li><strong>Costi Vivi / Software / Trasferte:</strong> €${extraCosts}</li>
            `;
        }

        let estimatedNet = Math.round(finalGross * 0.78);

        document.getElementById('proposalTypeName').innerText = "Preventivo Ufficiale • " + professionName;
        document.getElementById('finalGrossPrice').innerText = "€" + finalGross;
        document.getElementById('finalNetPrice').innerText = "Stima netto in tasca (circa): €" + estimatedNet;
        document.getElementById('rationaleText').innerHTML = `<ul>${rationaleDetails}</ul>`;
        document.getElementById('emailBody').innerText = `Salve,\n\nIn riferimento al progetto per la mansione di ${professionName}, ecco il preventivo ufficiale:\n\n• Totale Complessivo Lordo: €${finalGross}\n\nResto a disposizione per qualsiasi chiarimento o confronto sul brief.\n\nUn saluto,\n[Tuo Nome]`;

        document.getElementById('resultsBlock').style.display = 'block';
        document.getElementById('resultsBlock').scrollIntoView({ behavior: 'smooth' });
    }

    function copyText(elementId) {
        const text = document.getElementById(elementId).innerText;
        navigator.clipboard.writeText(text);
        alert("Testo copiato negli appunti!");
    }
</script>

</body>
</html>
